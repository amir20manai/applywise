<section class="toasts" aria-label="Notifications">
  @for (t of toast.toasts(); track t.id) {
    <div
      class="toast"
      [class.toast-error]="t.kind === 'error'"
      [attr.role]="t.kind === 'error' ? 'alert' : 'status'"
    >
      @if (t.kind === 'error') {
        <svg class="icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity="0.18" />
          <path d="M10 5.5v5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="10" cy="14.2" r="1.15" fill="currentColor" />
        </svg>
      } @else {
        <svg class="icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity="0.18" />
          <path d="M6 10.5l2.5 2.5L14 7.5" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }

      <div class="body">
        <p>{{ t.message }}</p>
        @if (t.action) {
          <a class="action" [routerLink]="t.action.link" (click)="toast.dismiss(t.id)">
            {{ t.action.label }}
          </a>
        }
      </div>

      <button type="button" class="close" aria-label="Dismiss" (click)="toast.dismiss(t.id)">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
        </svg>
      </button>
    </div>
  }
</section>
